<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FM Olive - Now Playing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, #45522f, #11150d 65%);
            color: #ffffff;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .card {
            width: min(600px, 100%);
            padding: 48px 32px;
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            backdrop-filter: blur(16px);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        }

        .station {
            margin: 0 0 24px;
            color: #b9ce83;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 7vw, 54px);
            line-height: 1.1;
        }

        .status {
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .live {
            display: inline-block;
            width: 9px;
            height: 9px;
            margin-right: 8px;
            border-radius: 50%;
            background: #b9ce83;
            box-shadow: 0 0 14px #b9ce83;
        	}
	.artist {
		font-size: clamp(36px, 7vw, 60px);
		font-weight: 700;
		color: #ffffff;
		margin-bottom: 12px;
		}

	.title {
    		font-size: clamp(24px, 5vw, 42px);
    		font-weight: 400;
    		color: #b9ce83;
    		line-height: 1.2;
		}
    </style>
</head>

<body>
    <main class="card">
        <p class="station">FM Olive · Now Playing</p>

 <div class="now-playing">
    <div id="artist" class="artist">Consultando...</div>
    <div id="title" class="title"></div>
</div>

        <p class="status">
            <span class="live"></span>
            <span id="update-status">
                Actualizando
            </span>
        </p>
    </main>

    <script>
        async function updateNowPlaying() {
            	const artist = document.getElementById("artist");
		const title = document.getElementById("title");
            	const status = document.getElementById("update-status");

            try {
                const response = await fetch(
                    "/api/now-playing",
                    { cache: "no-store" }
                );

                const data = await response.json();

                const parts = data.title.split(" - ");

		if (parts.length >= 2) {
    		artist.textContent = parts[0].trim();
    		title.textContent = parts.slice(1).join(" - ").trim();
		} else {
    		artist.textContent = data.title;
    		title.textContent = "";
		};

                status.textContent =
                    "Actualizado " +
                    new Date().toLocaleTimeString("es-AR");
            } catch (error) {
                song.textContent = "Radio temporalmente no disponible";
                status.textContent = "Error de conexión";
            }
        }

        updateNowPlaying();

        // 60.000 milisegundos = 1 minuto
        setInterval(updateNowPlaying, 60000);
    </script>
</body>
</html>
